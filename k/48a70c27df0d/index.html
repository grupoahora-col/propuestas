<style>

  button { width: 100%; background: #FFCC00; color: #111; border: 0; border-radius: 14px; font-weight: 800; font-size: 17px; padding: 17px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { min-height: 22px; margin-top: 12px; color: #FFB4A3; font-size: 15px; }

  const bytes = (b64) => { const s = atob(b64), u = new Uint8Array(s.length); for (let k = 0; k < s.length; k++) u[k] = s.charCodeAt(k); return u; };
  async function abrir(clave) {
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream) throw new Error('navegador');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(CIFRADO.sal), iterations: CIFRADO.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  document.getElementById('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('e');
    if (!c.value) return;
    b.disabled = true; b.textContent = 'Abriendo…'; e.textContent = '';
    try {
      const html = await abrir(c.value.trim());
      document.open(); document.write(html); document.close();

      const caja = document.querySelector('.caja'); caja.classList.remove('temblor'); void caja.offsetWidth; caja.classList.add('temblor');
