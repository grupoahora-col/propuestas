<title>Presentación privada</title>
<style>
  :root { --texto: #F5F3FF; --gris: #A1A1AA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(125% 125% at 50% 10%, #000 40%, #6633EE); color: var(--texto); font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; display: grid; place-items: center; padding: 16px; }
  .caja { width: 100%; max-width: 440px; text-align: center; }
  .mono { width: 68px; height: 68px; border-radius: 20px; background: linear-gradient(135deg, #3B82F6, #9333EA); display: grid; place-items: center; margin: 0 auto 28px; box-shadow: 0 0 40px rgba(147,51,234,.55); }
  .mono svg { width: 30px; height: 30px; }
  h1 { font: 700 34px/1.15 Poppins, 'Segoe UI', sans-serif; margin: 0 0 10px; letter-spacing: -.01em; }
  p { color: var(--gris); margin: 0 0 30px; font-size: 16px; line-height: 1.5; }
  form { display: flex; gap: 10px; }
  input { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); border-radius: 12px; color: var(--texto); font-size: 17px; padding: 14px 16px; outline: none; }
  input:focus { border-color: #A78BFA; background: rgba(255,255,255,.09); }
  button { background: linear-gradient(90deg, #3B82F6, #9333EA); color: #fff; border: 0; border-radius: 12px; font-weight: 700; font-size: 16px; padding: 0 22px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { min-height: 24px; margin-top: 14px; color: #FCA5A5; font-size: 15px; }
  .pie { margin-top: 40px; font-size: 13px; color: #71717A; }
  .temblor { animation: temblor .35s; }
  @keyframes temblor { 0%, 100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
</style>
</head>

const bytes = (b64) => { const s = atob(b64), u = new Uint8Array(s.length); for (let k = 0; k < s.length; k++) u[k] = s.charCodeAt(k); return u; };
async function abrir(clave) {
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) throw new Error('navegador');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(DATOS.sal), iterations: DATOS.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATOS.iv) }, llave, bytes(DATOS.dat));
  return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('e');
  if (!c.value) return;
  b.disabled = true; b.textContent = 'Abriendo…'; e.textContent = '';
  try {
    const html = await abrir(c.value);
    document.open(); document.write(html); document.close();
  } catch (x) {
    b.disabled = false; b.textContent = 'Entrar';
    e.textContent = x && x.message === 'navegador' ? 'Este navegador no puede abrirla. Use Chrome, Edge o Safari actualizados.' : 'Clave incorrecta.';
    const caja = document.querySelector('.caja'); caja.classList.remove('temblor'); void caja.offsetWidth; caja.classList.add('temblor');
    c.select();
  }
});
